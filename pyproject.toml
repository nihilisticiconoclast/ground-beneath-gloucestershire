[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbg"
version = "0.2.0"
description = "The Ground Beneath Gloucestershire — a 3D lithology model reconstructed from BGS scanned borehole logs, with per-voxel uncertainty."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "nihilisticiconoclast" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "duckdb>=1.0",
    "pyproj>=3.6",
    "typer>=0.12",
    "rich>=13",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
# Stage 0/1: LLM-backed extraction. Ollama needs no key; Anthropic is optional.
llm = ["anthropic>=0.40"]
# MCP server (`gbg-mcp`): the SDK is 2.x — FastMCP was renamed MCPServer in 2.0.
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mcp>=2,<3"]

[project.scripts]
gbg = "gbg.cli:app"
gbg-mcp = "gbg.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gbg = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
